<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-5">
    <div class="todo-box mx-auto">
      <h1 class="text-center mb-2">My To-Do List</h1>
      <p class="text-center text-muted mb-4">
        Add a task, tick it off when it is done, and it stays saved even after refresh.
      </p>

      <form id="task-form" class="d-flex gap-2 mb-3">
        <input id="task-input" type="text" class="form-control" placeholder="What do you need to do?" autocomplete="off">
        <button type="submit" class="btn btn-primary">Add</button>
      </form>

      <ul id="task-list" class="list-group mb-3"></ul>

      <div class="d-flex justify-content-between align-items-center">
        <p id="task-count" class="text-muted mb-0"></p>
        <button id="clear-done-btn" type="button" class="btn btn-outline-secondary btn-sm">Clear completed</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
